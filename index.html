<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="Unofficial study map of Santa Clara County Fire Department stations, apparatus and hospitals. Not an SCCFD product.">
<title>SCCFD Field Atlas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Semi+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* VOICE   quiet, exact, a dispatch console at 0300: nothing decorative, everything earns its place
   IDEA    a CAD map screen plus the station run card you'd tape inside a rig's cab door
   PICTURE the county itself, drawn from Census lines, with 19 numbered station markers
   COLOUR  near-black ground, graphite land, apparatus red only for the selected station
   TYPE    Barlow (drawn from California highway signage) + its semi-condensed cut for unit IDs */
:root{color-scheme:dark;
 --water:#0b0d10;--land:#13161a;--home:#191d22;--city:#20252c;--border:#2a3038;--homeedge:#3a424c;
 --road:#2b3239;--fwy:#3d4650;--shield:#262c33;--shieldink:#9aa3ad;
 --panel:#101317;--panel2:#161a1f;--rule:#22272e;--rule2:#323942;--hover:#1a1f25;
 --ink:#e8eaed;--muted:#8d959f;--faint:#5c646e;--red:#e5372d;--redsoft:rgba(229,55,45,.38);
 --mk:#0f1215;--mkline:#7b848e;--chipink:#0f1215;--shadow:0 12px 40px rgba(0,0,0,.45)}
:root[data-theme=light]{color-scheme:light;
 --water:#d9e1e8;--land:#ecedeb;--home:#f7f7f5;--city:#ffffff;--border:#c9cdd1;--homeedge:#9ea5ad;
 --road:#dcdfe2;--fwy:#b9bfc6;--shield:#ffffff;--shieldink:#4d555e;
 --panel:#ffffff;--panel2:#f5f6f7;--rule:#e4e6e9;--rule2:#cfd3d8;--hover:#f1f3f5;
 --ink:#15181c;--muted:#5b636c;--faint:#8c949c;--red:#cf2a20;--redsoft:rgba(207,42,32,.35);
 --mk:#ffffff;--mkline:#6a737c;--chipink:#ffffff;--shadow:0 12px 40px rgba(20,25,30,.14)}
:root{--b74:#5b9cf5;--s72:#e9a23b;--b83:#3fbf8f;--b68:#b07cf2;--chipbg:var(--ink);
 --u-engine:#ef5246;--u-truck:#f0a63a;--u-rescue:#5b9cf5;--u-hazmat:#e3cf3c;--u-command:#d9dde2;--u-tender:#3cc4d4;--u-other:#8d959f}
:root[data-theme=light]{--b74:#1f64d6;--s72:#b86e00;--b83:#0f8a5c;--b68:#7d45cc;
 --u-engine:#c9261c;--u-truck:#b86e00;--u-rescue:#1f64d6;--u-hazmat:#8a7700;--u-command:#2a2f36;--u-tender:#0a8494;--u-other:#5b636c}
/* look: midnight */
:root[data-flavor=midnight]:not([data-theme=light]){--water:#050a13;--land:#0b1321;--home:#0f1a2c;--city:#152339;--border:#1e2d45;--homeedge:#36507a;--road:#1b2a42;--fwy:#2b4568;--shield:#122039;--shieldink:#93b4dc;
 --panel:#0a111e;--panel2:#0f192b;--rule:#18253c;--rule2:#25375a;--hover:#121f35;--ink:#e6edf7;--muted:#8c9db8;--faint:#5a6b8c;--mk:#0a111e;--mkline:#7f93b3;--chipink:#0a111e;
 --b74:#6aa8ff;--s72:#ffb547;--b83:#4ddba5;--b68:#c690ff}
:root[data-flavor=midnight][data-theme=light]{--water:#cddbeb;--land:#e7ecf3;--home:#f5f8fc;--border:#c1cede;--panel2:#f0f4fa;--hover:#e9eff7}
/* look: reflective (hi-vis striping) */
:root[data-flavor=reflective]:not([data-theme=light]){--water:#0a0a09;--land:#121211;--home:#181816;--city:#201f1b;--border:#2c2b27;--homeedge:#4a493f;--road:#2a2925;--fwy:#403f35;--shield:#1d1c19;--shieldink:#b9b8a8;
 --panel:#0f0f0e;--panel2:#171715;--rule:#252421;--rule2:#36352f;--hover:#1c1b19;--ink:#f2f1e9;--muted:#9c9b8f;--faint:#67665c;--mk:#0f0f0e;--mkline:#8b8a7e;--chipink:#0f0f0e;
 --chipbg:#c8f03c;--b74:#c8f03c;--s72:#ff9f1c;--b83:#36d3cb;--b68:#ff5fa2}
:root[data-flavor=reflective][data-theme=light]{--chipbg:#15181c;--b74:#5c7c00;--s72:#c26700;--b83:#08857f;--b68:#c2246a}
*{box-sizing:border-box;min-width:0}
html,body{height:100%}
body{margin:0;background:var(--panel);color:var(--ink);font:16px/1.5 "Barlow",system-ui,sans-serif;overflow:hidden;display:grid;grid-template-rows:auto minmax(0,1fr);height:100dvh}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
:focus-visible{outline:2px solid var(--red);outline-offset:2px;border-radius:6px}
.c{font-family:"Barlow Semi Condensed","Barlow",sans-serif}
/* header */
.bar{display:flex;align-items:center;gap:14px;padding:10px 16px;border-bottom:1px solid var(--rule);background:var(--panel);position:relative;z-index:5}
.brand{display:flex;align-items:center;gap:10px;flex:none}
.brand b{font:600 19px/1 "Barlow Semi Condensed",sans-serif;letter-spacing:.01em}
.brand span{color:var(--muted);font-size:14px}
.search{position:relative;flex:1 1 260px;max-width:420px}
.search input{width:100%;height:40px;border-radius:8px;border:1px solid var(--rule2);background:var(--panel2);color:var(--ink);font:16px "Barlow",sans-serif;padding:0 12px 0 36px}
.search input::placeholder{color:var(--faint)}
.search input:focus-visible{outline:1.5px solid var(--red);outline-offset:0}
.search svg{position:absolute;left:11px;top:12px;color:var(--faint)}
.results{position:absolute;top:46px;left:0;right:0;background:var(--panel);border:1px solid var(--rule2);border-radius:10px;box-shadow:var(--shadow);padding:6px;display:none}
.results.on{display:block}
.results button{display:flex;align-items:center;gap:10px;width:100%;min-height:44px;padding:6px 10px;border-radius:7px;text-align:left}
.results button[aria-selected=true],.results button:hover{background:var(--hover)}
.results small{color:var(--muted);margin-left:auto;font-size:13px}
.seg{display:flex;gap:2px;padding:3px;border:1px solid var(--rule2);border-radius:9px;background:var(--panel2);overflow-x:auto;flex:none}
.seg button{height:34px;padding:0 12px;border-radius:6px;font:600 14px "Barlow Semi Condensed",sans-serif;color:var(--muted);white-space:nowrap}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--panel)}
.icon{width:40px;height:40px;border-radius:8px;display:grid;place-items:center;border:1px solid var(--rule2);color:var(--muted);flex:none}
.tools{display:flex;align-items:center;gap:8px;margin-left:auto;flex:none}
:root[data-theme=dark] .sun,:root[data-theme=light] .moon{display:none}
/* layout */
main{display:grid;grid-template-columns:minmax(0,1fr) 400px;min-height:0;position:relative}
#map{position:relative;overflow:hidden;background:var(--water)}
#svg{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}
#svg.drag{cursor:grabbing}
.land{fill:var(--land);stroke:var(--border);stroke-width:1}
.home{fill:var(--home);stroke:none}
.city{fill:var(--city);stroke:var(--border);stroke-width:.8}
.cityedge{fill:none;stroke:var(--border);stroke-width:.6;stroke-dasharray:2 3}
.water{fill:var(--water);stroke:none}
.homeedge{fill:none;stroke:var(--homeedge);stroke-width:1.3}
.hwy{fill:none;stroke:var(--road);stroke-width:1.1;stroke-linejoin:round}
.fwy{fill:none;stroke:var(--fwy);stroke-width:1.8;stroke-linejoin:round}
path{vector-effect:non-scaling-stroke}
.lbl{font:500 12.5px "Barlow",sans-serif;fill:var(--faint);letter-spacing:.02em}
.lbl.sc{fill:var(--muted)}
.lbl.big{font-size:14px}
.sh rect{fill:var(--shield);stroke:var(--rule2)}
.sh text{font:600 10.5px "Barlow Semi Condensed",sans-serif;fill:var(--shieldink);text-anchor:middle}
.link{stroke-width:1.4;fill:none;opacity:.6}
.mk{cursor:pointer;transition:opacity .25s}
.mk .dot{fill:var(--mk);stroke:var(--mkline);stroke-width:2}
.mk .ring{fill:none;stroke:var(--mkline);stroke-width:1.2;opacity:.85}
.mk text{font:700 11px "Barlow Semi Condensed",sans-serif;fill:var(--ink);text-anchor:middle;pointer-events:none}
.mk .hit{fill:transparent}
.mk:hover .dot{stroke:var(--ink)}
.mk.dim{opacity:.22}
.mk.sel .dot{fill:var(--red);stroke:var(--red)}
.mk.sel text{fill:#fff}
.mk.sel .ring{stroke:var(--red)}
.pulse{fill:none;stroke:var(--red);stroke-width:1.5;opacity:0;animation:pulse 2.4s ease-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pulse{0%{opacity:.7;transform:scale(1)}100%{opacity:0;transform:scale(2.6)}}
.name{font:600 13px "Barlow Semi Condensed",sans-serif;fill:var(--ink);paint-order:stroke;stroke:var(--home);stroke-width:3px;stroke-linejoin:round;pointer-events:none}
.name.dim{opacity:.25}
.fac rect{fill:var(--muted)}
.ctl{position:absolute;right:12px;top:12px;display:grid;gap:6px}
.uf{position:absolute;left:12px;top:12px;right:70px;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:2px}
.uf::-webkit-scrollbar{display:none}
.uf button{flex:none;height:36px;padding:0 13px;border-radius:18px;background:var(--panel);border:1px solid var(--rule2);color:var(--muted);font:600 14px "Barlow Semi Condensed",sans-serif;box-shadow:var(--shadow);white-space:nowrap}
.uf button:hover{color:var(--ink)}
.uf button[aria-pressed=true]{background:var(--chipbg);color:var(--chipink);border-color:var(--chipbg)}
.uf button i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:6px;vertical-align:0}
.mk.half{opacity:.5}
.row .codes .m{color:var(--ink)}
.ctl button{width:44px;height:44px;border-radius:9px;background:var(--panel);border:1px solid var(--rule2);display:grid;place-items:center;color:var(--muted);box-shadow:var(--shadow)}
.ctl button:hover{color:var(--ink)}
.scale{position:absolute;left:14px;bottom:14px;font:500 12px "Barlow",sans-serif;color:var(--muted);pointer-events:none}
.scale i{display:block;height:6px;border:1.5px solid var(--muted);border-top:0;margin-top:3px}
/* panel */
#panel{background:var(--panel);border-left:1px solid var(--rule);overflow:hidden;display:flex;flex-direction:column}
.grab{display:none}
#pbody{overflow:auto;padding:22px 22px 40px;flex:1;overscroll-behavior:contain}
.enter{animation:enter .22s ease-out}
@keyframes enter{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
h1{font:600 34px/1.05 "Barlow Semi Condensed",sans-serif;margin:0;text-wrap:balance}
h3{font:600 13px "Barlow",sans-serif;color:var(--muted);margin:28px 0 8px;padding-bottom:6px;border-bottom:1px solid var(--rule)}
.dept{color:var(--muted);margin:0 0 6px;font-size:14px}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:18px 0 4px}
.stats b{display:block;font:600 26px/1.1 "Barlow Semi Condensed",sans-serif;white-space:nowrap}
.stats span{color:var(--muted);font-size:13px;line-height:1.3;display:block}
.bhead{display:flex;align-items:baseline;gap:10px;margin:26px 0 6px}
.bhead button{font:600 17px "Barlow Semi Condensed",sans-serif}
.bhead button:hover{color:var(--red)}
.bhead small{color:var(--muted);font-size:13px;margin-left:auto;white-space:nowrap}
.area{color:var(--muted);font-size:14px;margin:0 0 6px}
.note{font-size:14px;color:var(--muted);background:var(--panel2);border:1px solid var(--rule);border-radius:8px;padding:10px 12px;margin:10px 0}
.row{display:grid;grid-template-columns:34px minmax(0,1fr) auto;align-items:center;gap:12px;width:100%;min-height:50px;padding:6px 8px;margin:0 -8px;width:calc(100% + 16px);border-radius:8px;text-align:left}
.row:hover{background:var(--hover)}
.badge{width:30px;height:30px;border-radius:50%;border:2px solid var(--mkline);display:grid;place-items:center;font:700 12px "Barlow Semi Condensed",sans-serif;font-variant-numeric:tabular-nums}
.badge.hq{box-shadow:0 0 0 3px var(--panel),0 0 0 4.5px var(--bc,var(--mkline))}
.row strong{font-weight:600;display:block;line-height:1.2}
.row em{font-style:normal;color:var(--muted);font-size:13.5px}
.row .codes{font:600 13px "Barlow Semi Condensed",sans-serif;color:var(--muted);text-align:right;white-space:nowrap}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin-top:22px}
.legend span{display:flex;align-items:center;gap:7px}
.src{font-size:13px;color:var(--faint);margin-top:22px;line-height:1.6}
.src a{color:var(--muted)}
.crumbs{display:flex;align-items:center;gap:4px;font-size:14px;color:var(--muted);margin:-6px 0 14px}
.crumbs button{min-height:36px;padding:0 6px;border-radius:6px;color:var(--muted)}
.crumbs button:hover{color:var(--ink);background:var(--hover)}
.crumbs .nav{margin-left:auto;display:flex;gap:4px}
.crumbs .nav button{width:36px;border:1px solid var(--rule2)}
.hero{display:grid;grid-template-columns:auto minmax(0,1fr);gap:16px;align-items:end}
.num{font:700 72px/.82 "Barlow Semi Condensed",sans-serif;font-variant-numeric:tabular-nums;letter-spacing:-.01em;padding-bottom:4px;border-bottom:3px solid var(--red)}
.addr{margin:6px 0 0;color:var(--muted);font-size:15px;line-height:1.35}
dl{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px 16px;margin:20px 0 0}
dl.wide{grid-template-columns:7.5em minmax(0,1fr);gap:8px 14px;margin-top:4px}
dt{color:var(--muted);font-size:13px}
dd{margin:0;font-weight:500;line-height:1.3}
dl:not(.wide) dd{margin-top:2px}
.units{display:grid;gap:2px}
.unit{display:grid;grid-template-columns:76px minmax(0,1fr) auto;align-items:center;gap:12px;min-height:42px}
.chip{font:600 13px/1 "Barlow Semi Condensed",sans-serif;padding:6px 0;border-radius:4px;border:1.3px solid var(--rule2);text-align:center;letter-spacing:.03em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip{border-left:3px solid var(--c,var(--rule2))}
.chip{background:none;border:0;border-left:3px solid var(--c);border-radius:0;text-align:left;padding:3px 0 3px 9px;font-size:14px;color:var(--ink)}
.seg i,.bhead i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:1px}
.photo{margin:0 -22px 18px;position:relative;aspect-ratio:3/2;background:var(--panel2);overflow:hidden}
.photo img{width:100%;height:100%;object-fit:cover;display:block}
.photo figcaption{position:absolute;right:10px;bottom:7px;font-size:12px;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.8)}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.acts a,.acts button{display:inline-flex;align-items:center;gap:6px;min-height:38px;padding:0 12px;border:1px solid var(--rule2);border-radius:7px;font-size:14px;color:var(--ink);text-decoration:none;background:var(--panel2)}
.acts a:hover,.acts button:hover{border-color:var(--mkline)}
.acts .sv{background:var(--chipbg);color:var(--chipink);border-color:var(--chipbg);font-weight:600}
.looks{display:flex;align-items:center;gap:2px;height:40px;padding:0 4px 0 12px;border-radius:9px;background:var(--panel2);border:1px solid var(--rule2);font-size:13px;color:var(--muted)}
.looks b{font-weight:600;color:var(--ink);margin-right:4px;min-width:5.6em}
@media (max-width:1180px){.looks b{display:none}.looks{padding-left:4px}}
.looks button{width:32px;height:32px;flex:none;border-radius:50%;display:grid;place-items:center}
.looks button i{width:20px;height:20px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(255,255,255,.18)}
.looks button[aria-pressed=true]{box-shadow:0 0 0 2px var(--ink)}
.unit small{color:var(--muted);font-size:13px;display:block;line-height:1.25}
.unit .staff{font:600 14px "Barlow Semi Condensed",sans-serif;color:var(--muted);white-space:nowrap}
.sub{font-size:12.5px;color:var(--faint);margin:6px 0 2px}
.keyfacts{display:grid;grid-template-columns:auto auto minmax(0,1fr);gap:24px;margin:18px 0 2px}
.keyfacts b{display:block;font:600 22px/1.15 "Barlow Semi Condensed",sans-serif}
.keyfacts i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:7px;vertical-align:3px}
.keyfacts span{color:var(--muted);font-size:13px}
details.more{margin-top:24px;border-top:1px solid var(--rule)}
details.more summary{cursor:pointer;color:var(--muted);font-size:14px;padding:12px 0;min-height:44px}
/* places */
:root{--hosp:#5aa2ff;--ok:#3dbb7a;--k-school:#d9a83a;--k-park:#53b37f;--k-peak:#b08d68;--k-venue:#a08cf5;--k-tech:#48b9d8;--k-ems:#ff8a65}
:root[data-theme=light]{--hosp:#1e62d0;--ok:#1d8a4e;--k-school:#a87a10;--k-park:#2f8a58;--k-peak:#86643f;--k-venue:#6f55d9;--k-tech:#1a85a6;--k-ems:#d9532c}
.k-school{--kc:var(--k-school)}.k-park{--kc:var(--k-park)}.k-peak{--kc:var(--k-peak)}.k-venue{--kc:var(--k-venue)}.k-tech{--kc:var(--k-tech)}.k-ems{--kc:var(--k-ems)}
.pl{cursor:pointer;transition:opacity .25s}.pl .hit{fill:transparent}
.pl.h rect{fill:#f4f4f1;stroke:rgba(0,0,0,.28);stroke-width:1}
:root[data-theme=light] .pl.h rect{fill:#fff;stroke:#8d939a;stroke-width:1.2}
:root[data-theme=light] .hbig,:root[data-theme=light] .mini-h,:root[data-theme=light] .promo .pi.h{background:#fff;box-shadow:inset 0 0 0 1.2px #8d939a}.pl.h .hx{fill:none;stroke:#d8241b;stroke-width:2.5}

.pl.h.sel rect{fill:#d8241b;stroke:#d8241b}.pl.h.sel .hx{stroke:#fff}
.pl.h.wrong rect{stroke:var(--red);stroke-width:2;stroke-dasharray:3 2}
.pl.dim{opacity:.22}
.pl.l{color:var(--kc)}.pl.l.far .d{fill:var(--kc);opacity:.7}.pl.l .bg{fill:var(--mk);stroke:var(--kc);stroke-width:1.4}.pl.l.sel .bg{fill:var(--kc)}.pl.l.sel use{color:var(--mk)}
.pl .pulse{stroke:var(--red)}.pl.l .pulse{stroke:var(--kc)}
.plbl{font:600 11.5px "Barlow Semi Condensed",sans-serif;fill:var(--muted);paint-order:stroke;stroke:var(--home);stroke-width:3px;stroke-linejoin:round;pointer-events:none}
.plbl.h{fill:var(--ink)}.plbl.dim{opacity:.25}
.pulse.p2{animation-delay:1.2s}
.lay{position:absolute;right:66px;top:12px;width:250px;padding:12px 14px;border-radius:12px;background:var(--panel);border:1px solid var(--rule2);box-shadow:var(--shadow);z-index:3}
.lay p{margin:0 0 6px;font-size:13px;color:var(--muted)}
.lay label{display:flex;align-items:center;gap:10px;min-height:36px;font-size:15px;cursor:pointer}
.lay input{width:18px;height:18px;accent-color:var(--hosp);margin:0}
.lay .sw{width:18px;height:18px;border-radius:50%;border:2px solid var(--muted)}.lay .sw.h{border-radius:4px;border-color:var(--hosp);color:var(--hosp);font:700 10px/14px "Barlow Semi Condensed";text-align:center}
.lay .sub2{padding-left:28px}.lay .sub2 label{font-size:14px;min-height:32px;color:var(--muted)}.lay .sub2 i{width:9px;height:9px;border-radius:50%;background:var(--kc)}
.lay input:disabled+i{opacity:.4}
.hbig{width:64px;height:64px;border-radius:13px;display:grid;place-items:center;background:#f4f4f1;box-shadow:inset 0 0 0 1px rgba(0,0,0,.15)}.hbig svg,.pi.h svg{display:block}
.lbig{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;border:2px solid var(--kc);color:var(--kc)}
.dchips{display:flex;flex-wrap:wrap;gap:6px}
.dchip{padding:7px 11px;border-radius:7px;background:var(--panel2);border:1px solid var(--rule2);font-size:14.5px;font-weight:500}
.dchip.info{color:var(--muted);border-style:dashed}
.drow{padding:10px 0;border-bottom:1px solid var(--rule)}
.dname{display:flex;width:100%;justify-content:space-between;align-items:baseline;min-height:34px;text-align:left}
.dname b{font-weight:600;font-size:15.5px}.dname small{color:var(--muted);font-size:13px}
.dname:hover b,.drow.on .dname b{color:var(--hosp)}
.dh{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.dh button{min-height:34px;padding:0 11px;border-radius:7px;border:1px solid var(--rule2);background:var(--panel2);font-size:14px}
.dh button:hover{border-color:var(--hosp)}.dh em{font-style:normal;color:var(--muted);font-size:12.5px}

.choices .k{position:absolute;right:9px;top:7px;font-size:11px;color:var(--faint)}

.choices .ck{position:absolute;right:9px;bottom:7px;font-style:normal;font-weight:700;color:var(--ok)}

.choices .bad,.result.bad{border-color:var(--red);background:rgba(229,55,45,.12)}

.next{margin-top:12px;width:100%;min-height:48px;border-radius:9px;background:var(--chipbg);color:var(--chipink);font:600 18px "Barlow Semi Condensed",sans-serif}

}

<script>
{

const ring=(r,close)=>{let s='';for(let i=0;i<r.length;i++){const p=P(r[i][0],r[i][1]);s+=(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)}return close?s+'Z':s};

function search(raw){const q=norm(raw),ql=raw.trim().toLowerCase();hits=[];if(!q){resBox.classList.remove('on');return}
 for(const s of ST){let sc=0;if(String(s.num)===q.replace(/^(station|sta|st)/,''))sc=100;else if(String(s.num).startsWith(q))sc=60;else if(s.name.toLowerCase().startsWith(ql))sc=80;else if(s.name.toLowerCase().includes(ql))sc=50;else if((s.city+' '+s.jurisdiction).toLowerCase().includes(ql))sc=30;if(sc)hits.push({sc,s,label:`Station ${s.num} · ${s.name}`,hint:s.jurisdiction})
  if(q.length>=2)for(const u of s.units){if(u.type==='antique')continue;const keys=[norm(uCode(u)),norm(uName(u))];const exact=keys.includes(q),pre=keys.some(k=>k.startsWith(q));if(exact||pre)hits.push({sc:exact?90:40,s,label:uName(u),hint:`Station ${s.num} ${s.name}`})}}
 if(q.length>=3)for(const p of [...PL.hospitals,...PL.landmarks]){const n=p.name.toLowerCase(),sh=(p.short||'').toLowerCase();const sc=n.startsWith(ql)||sh.startsWith(ql)||p.id.toLowerCase()===ql?45:n.includes(ql)?25:0;if(sc)hits.push({sc,p,label:p.name,hint:p.des?'Hospital':KIND1[p.kind]})}
 hits.sort((a,b)=>b.sc-a.sc||((a.s?a.s.num:999)-(b.s?b.s.num:999)));hits=hits.slice(0,8);hi=0;
 resBox.innerHTML=hits.length?hits.map((h,i)=>`<button role="option" data-i="${i}" aria-selected="${i===hi}"><span class="badge">${h.s?h.s.num:h.p.des?'H':'·'}</span>${esc(h.label)}<small>${esc(h.hint)}</small></button>`).join(''):'<p class="sub" style="padding:8px 10px;margin:0">No station, unit or place matches that.</p>';
 resBox.classList.add('on')}
function pick(i){const h=hits[i];if(!h)return;qIn.value='';resBox.classList.remove('on');qIn.blur();h.s?select(h.s.num):selectPlace(h.p.id)}
qIn.addEventListener('input',()=>search(qIn.value));
qIn.addEventListener('keydown',e=>{if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();if(!hits.length)return;hi=(hi+(e.key==='ArrowDown'?1:-1)+hits.length)%hits.length;[...resBox.children].forEach((b,i)=>b.setAttribute('aria-selected',String(i===hi)))}else if(e.key==='Enter'){e.preventDefault();pick(hi)}else if(e.key==='Escape'){qIn.value='';search('');qIn.blur()}});
resBox.addEventListener('pointerdown',e=>{const b=e.target.closest('[data-i]');if(b){e.preventDefault();pick(+b.dataset.i)}});
qIn.addEventListener('blur',()=>setTimeout(()=>resBox.classList.remove('on'),120));

/* panel clicks */
pbody.addEventListener('click',async e=>{const t=e.target.closest('button');if(!t||t.disabled)return;const g=state.game,a=t.dataset.act;
 if(t.dataset.game)return openSetup(t.dataset.game);
 if(t.dataset.count){setup.count=t.dataset.count==='all'?'all':+t.dataset.count;return renderSetup()}
 if(t.dataset.cat){setup.cat=t.dataset.cat;return renderSetup()}
 if(t.dataset.ch!=null){if(g&&g.phase==='ask'){g.cur.pick=g.cur.choices[+t.dataset.ch];reveal()}return}
 if(t.dataset.place)return selectPlace(t.dataset.place);
 if(t.dataset.hf)return setHF(t.dataset.hf);
 if(t.dataset.n)return select(+t.dataset.n);
 if(t.dataset.bat)return setBat(t.dataset.bat);
 if(a==='back')return goBack();
 if(a==='start'||a==='again')return startGame();
 if(a==='studyhome'){state.game=null;renderStudy();fitShown();if(isMob())setSheet(snaps()[1]);return}
 if(a==='study')return setMode('study');
 if(a==='hosps'){state.hf=null;return openHospitals()}
 if(a==='all'){state.uf=null;state.place=null;state.hf=null;ufSync();return setBat(null)}
 if(a==='clearuf')return setUF(null);
 if(a==='next')return g?nextRound():step(1);
 if(a==='prev')return step(-1);
 if(t.dataset.copy){try{await navigator.clipboard.writeText(t.dataset.copy);t.textContent='Copied'}catch(err){t.textContent='Copy blocked here'}setTimeout(()=>t.textContent='Copy address',1800)}});

/* map gestures */
const ptrs=new Map();let moved=0,downMk=null,downPl=null,pinch=null;
const pinfo=()=>{const[a,b]=[...ptrs.values()],r=svg.getBoundingClientRect();return{d:Math.hypot(a.x-b.x,a.y-b.y),mx:(a.x+b.x)/2-r.left,my:(a.y+b.y)/2-r.top}};
svg.addEventListener('pointerdown',e=>{cancelAnimationFrame(anim);downMk=e.target.closest('.mk');downPl=e.target.closest('.pl');svg.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});moved=0;if(ptrs.size===2)pinch=pinfo()});
svg.addEventListener('pointermove',e=>{const p=ptrs.get(e.pointerId);if(!p)return;const dx=e.clientX-p.x,dy=e.clientY-p.y;p.x=e.clientX;p.y=e.clientY;moved+=Math.abs(dx)+Math.abs(dy);
 if(ptrs.size===1&&moved>4){view.cx-=dx/view.k;view.cy-=dy/view.k;svg.classList.add('drag');sched()}
 else if(ptrs.size===2&&pinch){const n=pinfo();zoomAt(n.mx,n.my,n.d/Math.max(pinch.d,1));view.cx-=(n.mx-pinch.mx)/view.k;view.cy-=(n.my-pinch.my)/view.k;pinch=n}});
const up=e=>{if(!ptrs.has(e.pointerId))return;ptrs.delete(e.pointerId);if(ptrs.size<2)pinch=null;svg.classList.remove('drag');if(e.type==='pointerup'&&moved<6&&ptrs.size===0){if(state.game){gameTap(e);return}if(downMk)select(+downMk.dataset.n);else if(downPl)selectPlace(downPl.dataset.p);else if(state.sel||state.place){state.sel=null;state.place=null;state.hf=null;renderOverview();setHash(state.bat?state.bat.toLowerCase():'');sched()}}};
svg.addEventListener('pointerup',up);svg.addEventListener('pointercancel',up);
svg.addEventListener('wheel',e=>{e.preventDefault();cancelAnimationFrame(anim);const r=svg.getBoundingClientRect();zoomAt(e.clientX-r.left,e.clientY-r.top,Math.exp(-e.deltaY*(e.ctrlKey?.012:.0016)))},{passive:false});
const zBtn=f=>{const v=vp();flyTo({cx:view.cx,cy:view.cy,k:view.k*f})};
$('#zin').onclick=()=>zBtn(1.8);$('#zout').onclick=()=>zBtn(1/1.8);$('#zfit').onclick=()=>fitShown();
addEventListener('keydown',e=>{if(e.target===qIn)return;if(state.game){const g=state.game;if(g.phase==='reveal'&&(e.key==='Enter'||e.key===' ')){e.preventDefault();nextRound()}else if(g.phase==='ask'&&g.cur&&g.cur.choices&&/^[1-4]$/.test(e.key)){const o=g.cur.choices[+e.key-1];if(o!=null){g.cur.pick=o;reveal()}}return}if(e.key==='/'){e.preventDefault();qIn.focus()}else if(e.key==='ArrowRight')step(1);else if(e.key==='ArrowLeft')step(-1);else if(e.key==='Escape'){if(openMenu)closeMenu();else if(hist.length>1&&!isRoot(hist[hist.length-1]))goBack()}});
addEventListener('hashchange',()=>D&&route());

/* mobile sheet */
const snaps=()=>[150,Math.round(innerHeight*.46),Math.round(innerHeight*.84)];
function setSheet(h){sheet.style.height=h+'px';setTimeout(sched,300);sched()}
const grab=$('#grab');let gy=null,gh=0,gm=0;
grab.addEventListener('pointerdown',e=>{gy=e.clientY;gh=sheet.getBoundingClientRect().height;gm=0;grab.setPointerCapture(e.pointerId);sheet.classList.add('dragging')});
grab.addEventListener('pointermove',e=>{if(gy==null)return;const d=gy-e.clientY;gm=Math.max(gm,Math.abs(d));sheet.style.height=Math.min(innerHeight*.9,Math.max(110,gh+d))+'px';sched()});
grab.addEventListener('pointerup',()=>{if(gy==null)return;sheet.classList.remove('dragging');const h=sheet.getBoundingClientRect().height,s=snaps();gy=null;
 if(gm<6){setSheet(h<s[2]-40?s[2]:s[1]);return}setSheet(s.reduce((a,b)=>Math.abs(b-h)<Math.abs(a-h)?b:a))});

/* boot */
let lastW=0;new ResizeObserver(()=>{if(!D)return;const w=innerWidth;if(Math.abs(w-lastW)>40&&!state.sel){lastW=w;fitK=boundsView(ST.map(s=>[s.x,s.y])).k;fitTo(state.bat?BAT[state.bat].stations.map(n=>byNum[n]):ST,false)}else sched()}).observe(svg);
function init(){
 UT=D.unitTypes;ST=D.stations.map(s=>{const[x,y]=P(s.lon,s.lat);return{...s,x,y}});ST.forEach(s=>byNum[s.num]=s);D.battalions.forEach(b=>BAT[b.id]=b);
 for(const f of D.facilities){if(f.lat)[f.x,f.y]=P(f.lon,f.lat)}
 buildMap();
 initFbar();syncLayers();tabSync();
 lastW=innerWidth;fitK=boundsView(ST.map(s=>[s.x,s.y])).k;fitTo(ST,false);
 if(location.hash)route();else{renderOverview();sched()}}
Promise.all(['data/stations.json','data/geo.json','data/places.json'].map(u=>fetch(u).then(r=>{if(!r.ok)throw new Error(u+' '+r.status);return r.json()})))
 .then(([d,g,pl])=>{D=d;G=g;PL=pl;for(const p of [...PL.hospitals,...PL.landmarks]){[p.x,p.y]=P(p.lon,p.lat);PI[p.id]=p}for(const f of D.facilities)if(f.atStation==null&&!f.lat)f.skip=1;init()})
 .catch(err=>{pbody.innerHTML=`<p class="err">Couldn't load the atlas data (${esc(err.message)}).</p>`});
}
</script>
</body>
</html>
